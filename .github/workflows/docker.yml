name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push-backend:
    name: Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          dockerfile: ./Backend/Dockerfile
          push: ${{ github.event_name == 'push' }}   # only push on push to main, not PRs
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          dockerfile: ./Frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}   # only push on push to main, not PRs
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/clinic-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
