<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine Dental Clinic — AI Receptionist</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3c0 1.5.5 2.5.5 4 0 2-1 3-2 3s-2-1-2-3c0-1 .5-2 .5-3a3 3 0 0 0-3-3"/>
                        <path d="M12 2a3 3 0 0 1 3 3c0 1.5-.5 2.5-.5 4 0 2 1 3 2 3s2-1 2-3c0-1-.5-2-.5-3a3 3 0 0 1 3-3"/>
                    </svg>
                </div>
                <div>
                    <h1>Sunshine Dental Clinic</h1>
                    <span class="status" id="status">AI Receptionist Online</span>
                </div>
            </div>
            <div class="header-right">
                <span class="dot" id="dot"></span>
            </div>
        </header>

        <!-- Chat area -->
        <main class="chat" id="chat">
            <div class="message assistant">
                <div class="bubble">
                    Hello! I'm your AI receptionist. I can help you with clinic information, book appointments, look up existing appointments, or cancel one. How can I help you today?
                </div>
            </div>
        </main>

        <!-- Quick suggestions -->
        <div class="suggestions" id="suggestions">
            <button class="suggestion" data-msg="What are your working hours?">Working hours</button>
            <button class="suggestion" data-msg="What services do you offer?">Our services</button>
            <button class="suggestion" data-msg="Do you accept walk-ins?">Walk-ins?</button>
            <button class="suggestion" data-msg="I want to book an appointment">Book appointment</button>
        </div>

        <!-- Input -->
        <footer class="input-area">
            <form id="chat-form">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Type your message..."
                    autocomplete="off"
                    maxlength="2000"
                    required
                >
                <button type="submit" id="send-btn" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
